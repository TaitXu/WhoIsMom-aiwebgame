<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>方向 B · Direct 玩法发布 · 核心循环</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Form 来自内容：核心循环直接变成一条高饱和“动作跑道”，AI 与玩家交替接棒。 -->
  <main class="viewport direct-loop">
    <header>
      <h1>AI 不替玩家解谜。<br>AI 负责让每一次取证都不完全相同。</h1>
      <div class="badge">CORE LOOP · 20–40 SEC</div>
    </header>

    <section class="loop-band" aria-label="核心玩法循环">
      <article class="loop-step"><small>PLAYER</small><strong>移动<br>探索</strong><p>发现 NPC、障碍与候选青蛙</p></article>
      <article class="loop-step"><small>PLAYER</small><strong>分配<br>队员</strong><p>按性格与疲劳选择调查者</p></article>
      <article class="loop-step"><small>AI</small><strong>交谈<br>编码</strong><p>压缩事实，形成性格化记忆</p></article>
      <article class="loop-step"><small>PLAYER</small><strong>对证<br>复查</strong><p>确认、质疑或修正认知</p></article>
      <article class="loop-step"><small>AI FEEDBACK</small><strong>更新<br>覆写</strong><p>新信息进入有限记忆槽</p></article>
      <article class="loop-step"><small>DECISION</small><strong>还原<br>真相</strong><p>找候选青蛙对证并复盘</p></article>
    </section>

    <div class="feedback-rail">
      <div class="label">每条记忆的变量 →</div>
      <div class="factors-row"><span>性格</span><span>现有记忆</span><span>疲劳度</span><span>交谈对象</span><span>信息来源</span><span>同伴影响</span></div>
    </div>
    <div class="page-no">DIRECTION B · 02</div>
  </main>
  <script src="../scale.js"></script>
</body>
</html>
