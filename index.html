<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#58c8cf" />
    <title>Who is Mom</title>
  </head>
  <body>
    <main id="app" aria-label="Who is Mom 游戏">
      <canvas id="scene" aria-label="九区域水乡中的三维寻找妈妈游戏"></canvas>

      <section class="objective-block" aria-live="polite">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <span>WHO IS MOM</span>
          <strong data-objective>从孵化静池出发</strong>
        </div>
      </section>

      <section class="world-status" aria-label="世界状态">
        <div class="area-block">
          <span>当前区域</span>
          <strong data-region>孵化静池</strong>
        </div>
        <div class="resource-block resource-block--yellow">
          <span>灵感</span>
          <strong data-inspiration>0</strong>
        </div>
        <div class="resource-block resource-block--green">
          <span>已确认来源</span>
          <strong data-evidence>0/2</strong>
        </div>
        <div class="minimap" data-minimap aria-label="探索地图"></div>
      </section>

      <nav class="squad-dock" aria-label="蝌蚪小队" data-squad></nav>

      <aside class="agent-drawer" data-agent-drawer hidden aria-label="蝌蚪记忆与状态">
        <header>
          <div>
            <span data-drawer-personality></span>
            <strong data-drawer-name></strong>
          </div>
          <button class="icon-button icon-button--plain" type="button" data-action="close-drawer" title="关闭记忆" aria-label="关闭记忆">×</button>
        </header>
        <div class="agent-meters" data-agent-meters></div>
        <div class="memory-list" data-memory-list></div>
        <div class="drawer-actions" data-drawer-actions></div>
      </aside>

      <section class="context-bar" data-context-bar aria-live="polite">
        <div class="context-copy">
          <span data-selection-label>尚未选择蝌蚪</span>
          <strong data-selection-hint>点击队伍色块，或按 1-3</strong>
        </div>
        <div class="context-actions">
          <button class="icon-button" type="button" data-action="toggle-details" disabled title="查看记忆" aria-label="查看选中蝌蚪的记忆">▤</button>
          <button class="icon-button icon-button--accent" type="button" data-action="recall" disabled title="召回" aria-label="召回选中的蝌蚪">↶</button>
        </div>
      </section>

      <section class="interaction-prompt" data-interaction-prompt hidden></section>

      <div class="controls-hint" aria-hidden="true">
        <span><kbd>WASD</kbd> 游动</span>
        <span><kbd>点击水面</kbd> 前往</span>
        <span><kbd>M</kbd> 记忆</span>
      </div>

      <div class="touch-pad" aria-label="触控移动">
        <button type="button" data-move-direction="up" aria-label="向前游">↑</button>
        <button type="button" data-move-direction="left" aria-label="向左游">←</button>
        <button type="button" data-move-direction="down" aria-label="向后游">↓</button>
        <button type="button" data-move-direction="right" aria-label="向右游">→</button>
      </div>

      <div class="modal-layer" data-modal-layer hidden>
        <section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
          <div data-modal-content></div>
        </section>
      </div>

      <section class="ending-overlay" data-ending hidden aria-live="polite"></section>
      <aside class="debug-panel" data-debug-panel hidden aria-label="试玩调试"></aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
