<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>方向 C · 记忆水痕 · 机制</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Form 来自内容：外界信息像水波向内进入 Agent，再以被压缩和覆写的文字痕迹向玩家显现。 -->
  <main class="viewport ripple-mechanism">
    <header>
      <div>
        <div class="eyebrow">MEMORY IS NOT A DATABASE</div>
        <h1>一条事实，经过不同的蝌蚪，<br>会留下不同的水痕。</h1>
      </div>
      <p class="summary">AI 只在给定事实边界内编码记忆；真正的不确定性，来自性格、状态与传播过程。</p>
    </header>

    <section class="water-system" aria-label="记忆形成与覆写机制">
      <div class="rings">
        <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
        <div class="ring-core">形成<br>记忆</div>
        <span class="ring-label label-personality">性格</span>
        <span class="ring-label label-fatigue">疲劳</span>
        <span class="ring-label label-context">现有记忆</span>
        <span class="ring-label label-partner">交谈对象</span>
      </div>

      <div class="palimpsest">
        <div class="memory-line"><small>01 / 新增</small><strong>“妈妈戴着荷叶帽。”</strong><em>乌龟 · 亲眼所见</em></div>
        <div class="memory-line overwrite"><small>02 / 覆写</small><strong>“她在月牙苇湾。”</strong><em>小浪 · 语境遗漏</em></div>
        <div class="memory-line"><small>03 / 强化</small><strong>“荷叶帽，两个独立来源。”</strong><em>墨点 × 泡泡 · 对证</em></div>
        <div class="memory-line fading"><small>04 / 遗忘</small><strong>“三天前见过红围巾……”</strong><em>旧记忆 · 强度下降</em></div>
        <div class="decision-line">玩家不是判断一句话真不真，而是判断：谁从谁那里，在什么情况下，留下了这句话。</div>
      </div>
    </section>
    <div class="page-no">DIRECTION C · 02</div>
  </main>
  <script src="../scale.js"></script>
</body>
</html>
